<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sistem Retail Toko Elektronik</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
        }

        .center {
            text-align: center;
        }

        th {
            background: #333;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Sistem Retail Toko Elektronik</h1>

        <div id="dashboard">

        <p>
            Total Produk:
            <span id="total_produk">0</span>
        </p>

        <p>
            Total Transaksi:
            <span id="total_transaksi">0</span>
        </p>

        <p>
            Total Penjualan:
            Rp <span id="total_penjualan">0</span>
        </p>

    </div>

    <hr>

    <h2>Riwayat Transaksi</h2>

    <table>

    <thead>
    <tr>
        <th>ID</th>
        <th>Produk</th>
        <th>Qty</th>
        <th>Total</th>
    </tr>
    </thead>

    <tbody id="transaction-table">
    </tbody>

    </table>

    <hr>

    <h2>Tambah Produk</h2>
    <input type="text" id="nama_produk" placeholder="Nama Produk">
    <input type="text" id="kategori" placeholder="Kategori">
    <input type="number" id="harga" placeholder="Harga">
    <input type="number" id="stok" placeholder="Stok">
    <input type="hidden" id="product_id">

    <button onclick="addProduct()">
        Tambah Produk
    </button>

    <button onclick="updateProduct()">
        Update Produk
    </button>

    <hr>

    <h2>Transaksi Penjualan</h2>

    <select id="transaction_product">
    </select>

    <input
        type="number"
        id="transaction_qty"
        placeholder="Jumlah"
    >

    <button onclick="addTransaction()">
        Proses Transaksi
    </button>

    <hr>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nama Produk</th>
                <th>Kategori</th>
                <th>Harga</th>
                <th>Stok</th>
                <th>Aksi</th>
            </tr>
        </thead>

        <tbody id="product-table"></tbody>
    </table>

<script>

const API_URL = 'http://192.168.56.10:5000/api/products';

async function loadProducts() {

    const response = await fetch(API_URL);
    const products = await response.json();

    const dropdown =
        document.getElementById(
            'transaction_product'
        );

    dropdown.innerHTML = '';

    const table = document.getElementById('product-table');

    table.innerHTML = '';

    products.forEach(product => {

        table.innerHTML += `
            <tr>
                <td>${product.id}</td>
                <td>${product.nama_produk}</td>
                <td>${product.kategori}</td>
                <td>
                    Rp ${Number(product.harga).toLocaleString('id-ID')}
                </td>
                <td class="center">${product.stok}</td>

                <td class="center">
                    <button onclick="editProduct(
                        ${product.id},
                        '${product.nama_produk}',
                        '${product.kategori}',
                        ${product.harga},
                        ${product.stok}
                    )">
                        Edit
                    </button>

                    <button onclick="deleteProduct(${product.id})">
                        Hapus
                    </button>
                </td>
            </tr>
        `;
        dropdown.innerHTML += `
        <option value="${product.id}">
            ${product.nama_produk}
        </option>
        `;
    });
}

async function addProduct() {

    const nama_produk = document.getElementById('nama_produk').value;
    const kategori = document.getElementById('kategori').value;
    const harga = document.getElementById('harga').value;
    const stok = document.getElementById('stok').value;

    const response = await fetch(API_URL, {

        method: 'POST',

        headers: {
            'Content-Type': 'application/json'
        },

        body: JSON.stringify({
            nama_produk,
            kategori,
            harga,
            stok
        })
    });

    const result = await response.json();

    alert(result.message);

    loadProducts();

    document.getElementById('nama_produk').value = '';
    document.getElementById('kategori').value = '';
    document.getElementById('harga').value = '';
    document.getElementById('stok').value = '';
}

async function deleteProduct(id) {

    const konfirmasi =
        confirm("Yakin ingin menghapus produk ini?");

    if (!konfirmasi) {
        return;
    }

    const response = await fetch(
        `${API_URL}/${id}`,
        {
            method: 'DELETE'
        }
    );

    const result = await response.json();

    alert(result.message);

    loadProducts();
}

function editProduct(
    id,
    nama_produk,
    kategori,
    harga,
    stok
) {

    document.getElementById('product_id').value = id;

    document.getElementById('nama_produk').value = nama_produk;

    document.getElementById('kategori').value = kategori;

    document.getElementById('harga').value = harga;

    document.getElementById('stok').value = stok;
}

async function updateProduct() {

    const id =
        document.getElementById('product_id').value;

    if (!id) {
        alert('Pilih produk terlebih dahulu');
        return;
    }

    const nama_produk =
        document.getElementById('nama_produk').value;

    const kategori =
        document.getElementById('kategori').value;

    const harga =
        document.getElementById('harga').value;

    const stok =
        document.getElementById('stok').value;

    const response = await fetch(
        `${API_URL}/${id}`,
        {
            method: 'PUT',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({
                nama_produk,
                kategori,
                harga,
                stok
            })
        }
    );

    const result = await response.json();

    alert(result.message);

    loadProducts();

    document.getElementById('product_id').value = '';

    document.getElementById('nama_produk').value = '';
    document.getElementById('kategori').value = '';
    document.getElementById('harga').value = '';
    document.getElementById('stok').value = '';
}

async function addTransaction() {

    const product_id =
        document.getElementById(
            'transaction_product'
        ).value;

    const qty =
        document.getElementById(
            'transaction_qty'
        ).value;

    const response = await fetch(

        'http://192.168.56.10:5000/api/transactions',

        {
            method: 'POST',

            headers: {
                'Content-Type':
                    'application/json'
            },

            body: JSON.stringify({
                product_id,
                qty
            })
        }
    );

    const result =
        await response.json();

    alert(result.message);

    loadProducts();
    loadDashboard();
    loadTransactions();

    document.getElementById(
        'transaction_qty'
    ).value = '';
}

async function loadDashboard() {

    const response =
        await fetch(
            'http://192.168.56.10:5000/api/dashboard'
        );

    const data =
        await response.json();

    document.getElementById(
        'total_produk'
    ).innerText =
        data.total_produk;

    document.getElementById(
        'total_transaksi'
    ).innerText =
        data.total_transaksi;

    document.getElementById(
        'total_penjualan'
    ).innerText =
        Number(
            data.total_penjualan
        ).toLocaleString('id-ID');
}

async function loadTransactions() {

    const response =
        await fetch(
            'http://192.168.56.10:5000/api/transactions'
        );

    const data =
        await response.json();

    const table =
        document.getElementById(
            'transaction-table'
        );

    table.innerHTML = '';

    data.forEach(item => {

        table.innerHTML += `
        <tr>

            <td>${item.id}</td>

            <td>${item.nama_produk}</td>

            <td>${item.qty}</td>

            <td>
                Rp ${Number(
                    item.subtotal
                ).toLocaleString('id-ID')}
            </td>

        </tr>
        `;
    });
}

loadProducts();
loadDashboard();
loadTransactions();

</script>

</body>
</html>
